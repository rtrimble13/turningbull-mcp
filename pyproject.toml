[project]
name = "turningbull-mcp"
version = "0.1.0"
description = "Repo of MCP connectors (FMP and others) sharing a common toolkit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
fmp-mcp = "fmp_mcp.server:main"
bls-mcp = "bls_mcp.server:main"
bea-mcp = "bea_mcp.server:main"
ag-mcp = "ag_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turningbull_mcp", "src/fmp_mcp", "src/bls_mcp", "src/bea_mcp", "src/ag_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
